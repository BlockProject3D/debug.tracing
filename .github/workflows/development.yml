name: Development

on:
  - push
  - workflow_dispatch

jobs:
  test-build:
    uses: bp3d-actions/workflows/.github/workflows/Build_Test.yml@main

  analyze:
    uses: bp3d-actions/workflows/.github/workflows/Analyze.yml@main
    needs: test-build

  release:
    uses: bp3d-actions/workflows/.github/workflows/Release.yml@main
    needs: test-build
