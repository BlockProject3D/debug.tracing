[package]
name = "bp3d-tracing"
version = "1.0.0-rc.2.1.0"
authors = ["Yuri Edward <yuri6037@outlook.com>"]
edition = "2021"
description = "Tracing subscriber implementations for use with BP3D software. Supports traditional logging through bp3d-logger and supports remote profiling through TCP."
license = "BSD-3-Clause"
repository = "https://gitlab.com/bp3d/tracing/tracing"
readme = "../README.MD"
keywords = ["bp3d", "tracing"]
categories = ["development-tools", "development-tools::debugging", "development-tools::profiling"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bp3d-logger = "2.0.0-rc.3.0.0"
bp3d-os = { version = "1.0.0-rc.3.0.3", features = ["dirs", "env", "cpu-info"] }
time = "0.3.36"
serde = { version = "1.0.204", features = ["derive"] }
bp3d-debug = "1.0.0-rc.6.0.0"
toml = "0.8.14"
parking_lot = "0.12.3"
tokio = { version = "1.39.3", features = ["full"] }
bp3d-proto = { version = "1.0.0-rc.3.0.0", features = ["tokio"] }
bp3d-util = { version = "1.1.0", features = ["format"] }

[build-dependencies]
semver = "1.0.7"
bp3d-protoc = "1.0.0-rc.3.0.0"
